apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-posts
  namespace: eventworker
  labels:
    app: worker-posts
    worker-type: posts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-posts
  template:
    metadata:
      labels:
        app: worker-posts
        worker-type: posts
    spec:
      containers:
        - name: worker
          image: eventworker:dev
          imagePullPolicy: IfNotPresent # locally built dev image, not from a registry
          command: ["/usr/local/bin/worker"]
          args:
            - -nats=nats://nats.eventworker.svc.cluster.local:4222
            - -type=posts
            - -keywords=test
            - -langs=en
            - -http=:8090
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
  # DLQ subject for this type: events.dlq.posts
---
