# HorizontalPodAutoscaler resources for the per-type workers (CPU-based;
# the production queue-depth external-metric story is documented in comments).
#
# OPTIONAL FILE — HPA is NOT part of the core demo and is NOT available on
# every cluster: the HorizontalPodAutoscaler resource kind requires the
# cluster's metrics-server component (k3s.io: enable 'metrics-server' at
# install time; kind: not shipped — add a compatible autoscaler). On clusters
# without it, remove the `- hpa.yaml` line from kustomization.yaml; the core
# demo (namespace, NATS, ingest, 5 workers) deploys unchanged.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-posts
  namespace: eventworker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-posts
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

