# OPTIONAL — not required by the core demo.
# Corresponds to the design's optional Redis follows-burst state (design D6):
# the follows worker's sliding-window burst detector defaults to in-memory
# state, and the Redis code path is deliberately NOT wired into the deployed
# binaries (the pinned worker CLI has no -redis flag). This manifest exists so
# the topology is documented and apply-ready if the feature is later enabled.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: eventworker
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: eventworker
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
