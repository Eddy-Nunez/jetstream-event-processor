# NATS JetStream = the durable fanout fabric (design D2, broker package:
# stream EVENTS covering events.>, DLQ namespace events.dlq.<type>). Runs as a
# StatefulSet with a PVC so buffered events survive pod restarts (deploy spec:
# "Durable broker"). Two Services: 'nats' for the client port 4222 (the URL
# workers/ingest dial: nats://nats.eventworker.svc.cluster.local:4222) and
# 'nats-monitor' for the HTTP monitoring port 8222 (queue-depth scraping for
# the production HPA story lives on top of this).
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: eventworker
  labels:
    app: nats
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: nats-monitor
  namespace: eventworker
  labels:
    app: nats
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: eventworker
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - -js
            - -m
            - "8222"
            - --store_dir
            - /data
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi # k3s default StorageClass (local-path) backs this
