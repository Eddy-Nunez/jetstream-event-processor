apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Canonical deploy path: kubectl apply -k k8s/
# (optional-localstack is included so the manifest list is complete; the file
# documents why it is not required by the core demo).
namespace: eventworker
resources:
  - namespace.yaml
  - nats.yaml
  - ingest.yaml
  - workers.yaml
  - optional-localstack.yaml
