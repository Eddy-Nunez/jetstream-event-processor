apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Canonical deploy path: kubectl apply -k k8s/
# - hpa.yaml is OPTIONAL: it requires the cluster's metrics-server component
#   (not present on default k3s.io/kind). Remove that line on clusters that
#   do not serve HorizontalPodAutoscaler; the core demo deploys unchanged.
# - optional-localstack.yaml documents the posts→SQS parity sink; not
#   required by (and not wired into) the core demo.
namespace: eventworker
resources:
  - namespace.yaml
  - nats.yaml
  - ingest.yaml
  - workers.yaml
  - hpa.yaml
  - optional-localstack.yaml
